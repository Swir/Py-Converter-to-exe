name: Package and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v1.0.0)
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = "v1.0.0"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package application
        shell: pwsh
        run: |
          $folder = "Py-Converter-to-exe-$env:VERSION"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item "converterpy.py" "$folder/converterpy.py"
          Copy-Item "requirements.txt" "$folder/requirements.txt"
          Copy-Item "README.md" "$folder/README.md"
          @"
          This project wraps PyInstaller and therefore requires Python and PyInstaller on the target system.
          Install dependencies with: pip install -r requirements.txt
          Run with: python converterpy.py
          "@ | Set-Content "$folder/INSTALL.txt"
          $zip = "$folder.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:VERSION --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:VERSION "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $env:VERSION "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --target "${{ github.sha }}" --title "Py Converter to EXE $env:VERSION" --generate-notes --repo "${{ github.repository }}"
          }
